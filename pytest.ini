import pytest
import time
from unittest.mock import patch
from fastapi import HTTPException, status
from typing import Optional


class MockModeratorService:
    """模拟主持人服务，用于测试权限限制。"""

    def __init__(self):
        self.moderator_actions = {
            "mute": True,
            "announcement": True,
            "meeting_manage": True,
            "remove_member": False,
            "dissolve_group": False,
        }
        self.moderators = {"mod_001", "mod_002", "mod_003"}

    async def check_permission(self, user_id: str, action: str) -> bool:
        """检查用户是否有权执行指定操作。"""
        # 修复：同时校验用户是否为主持人
        if user_id not in self.moderators:
            return False
        return self.moderator_actions.get(action, False)

    async def execute_action(self, user_id: str, action: str, target_id: Optional[str] = None) -> dict:
        """执行操作；无权限或操作同级主持人时抛出 HTTPException。"""
        is_moderator_target = target_id in self.moderators if target_id else False

        if is_moderator_target and action in ("mute", "announcement"):
            raise HTTPException(
                status_code=status.HTTP_403_FORBIDDEN,
                detail="Cannot operate on another moderator",
            )

        if not await self.check_permission(user_id, action):
            raise HTTPException(
                status_code=status.HTTP_403_FORBIDDEN,
                detail=f"No permission to perform {action}",
            )

        return {"status": "ok", "action": action}


class TestModeratorPermission:
    """主持人权限限制测试套件。"""

    @pytest.fixture
    def service(self):
        """每个测试用例获取新的 MockModeratorService 实例。"""
        return MockModeratorService()

    @pytest.mark.asyncio
    async def test_remove_member_returns_403(self, service):
        """验证移除成员返回 HTTP 403。"""
        with pytest.raises(HTTPException) as exc_info:
            await service.execute_action("mod_001", "remove_member")
        assert exc_info.value.status_code == status.HTTP_403_FORBIDDEN
        assert "remove_member" in str(exc_info.value.detail)

    @pytest.mark.asyncio
    async def test_dissolve_group_returns_403(self, service):
        """验证解散群组返回 HTTP 403。"""
        with pytest.raises(HTTPException) as exc_info:
            await service.execute_action("mod_001", "dissolve_group")
        assert exc_info.value.status_code == status.HTTP_403_FORBIDDEN
        assert "dissolve_group" in str(exc_info.value.detail)

    @pytest.mark.asyncio
    async def test_mute_executes_successfully(self, service):
        """验证禁言操作正常执行。"""
        result = await service.execute_action("mod_001", "mute", target_id="member_001")
        assert result["status"] == "ok"
        assert result["action"] == "mute"

    @pytest.mark.asyncio
    async def test_announcement_creates_normally(self, service):
        """验证主持人能正常发布公告。"""
        result = await service.execute_action("mod_001", "announcement")
        assert result["status"] == "ok"
        assert result["action"] == "announcement"

    @pytest.mark.asyncio
    async def test_meeting_manage_works(self, service):
        """验证主持人能正常管理会议。"""
        result = await service.execute_action("mod_001", "meeting_manage")
        assert result["status"] == "ok"
        assert result["action"] == "meeting_manage"

    @pytest.mark.asyncio
    async def test_cannot_mute_fellow_moderator(self, service):
        """验证主持人无法禁言其他主持人。"""
        with pytest.raises(HTTPException) as exc_info:
            await service.execute_action("mod_001", "mute", target_id="mod_002")
        assert exc_info.value.status_code == status.HTTP_403_FORBIDDEN
        assert "moderator" in str(exc_info.value.detail).lower()

    @pytest.mark.asyncio
    async def test_cannot_announce_on_fellow_moderator(self, service):
        """验证主持人无法对同级主持人执行公告操作。"""
        with pytest.raises(HTTPException) as exc_info:
            await service.execute_action("mod_001", "announcement", target_id="mod_003")
        assert exc_info.value.status_code == status.HTTP_403_FORBIDDEN
        assert "moderator" in str(exc_info.value.detail).lower()

    @pytest.mark.asyncio
    async def test_permission_matrix_for_moderator(self, service):
        """验证主持人的完整权限矩阵。"""
        allowed = ["mute", "announcement", "meeting_manage"]
        denied = ["remove_member", "dissolve_group"]

        for action in allowed:
            result = await service.execute_action("mod_001", action, target_id="regular_user_999")
            assert result["status"] == "ok"
            assert result["action"] == action

        for action in denied:
            with pytest.raises(HTTPException) as exc_info:
                await service.execute_action("mod_001", action)
            assert exc_info.value.status_code == status.HTTP_403_FORBIDDEN
            assert action in str(exc_info.value.detail)

    @pytest.mark.asyncio
    async def test_regular_user_cannot_perform_moderator_actions(self, service):
        """验证普通用户不能执行主持人操作。"""
        for action in ["mute", "announcement", "meeting_manage"]:
            with pytest.raises(HTTPException) as exc_info:
                await service.execute_action("regular_user", action, target_id="member_001")
            assert exc_info.value.status_code == status.HTTP_403_FORBIDDEN

    @pytest.mark.asyncio
    async def test_invalid_action_returns_403(self, service):
        """验证非法/未知操作返回 403。"""
        with pytest.raises(HTTPException) as exc_info:
            await service.execute_action("mod_001", "unknown_op")
        assert exc_info.value.status_code == status.HTTP_403_FORBIDDEN
        assert "unknown_op" in str(exc_info.value.detail)

    @pytest.mark.asyncio
    async def test_empty_target_id_handled_correctly(self, service):
        """验证 target_id 为空字符串时不触发主持人保护逻辑。"""
        result = await service.execute_action("mod_001", "mute", target_id="")
        assert result["status"] == "ok"
        assert result["action"] == "mute"

    @pytest.mark.asyncio
    async def test_none_target_id_handled_correctly(self, service):
        """验证 target_id 为 None 时正常执行。"""
        result = await service.execute_action("mod_001", "mute", target_id=None)
        assert result["status"] == "ok"
        assert result["action"] == "mute"
