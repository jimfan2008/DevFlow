version: '3.9'

services:
  # ===== 基础设施服务 =====

  mysql:
    image: mysql:8.0
    container_name: gbm-hr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: gbm_hr_db
      MYSQL_USER: ${DB_USER:-hr_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hr_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gbm-hr-network

  redis:
    image: redis:7-alpine
    container_name: gbm-hr-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gbm-hr-network

  minio:
    image: minio/minio:latest
    container_name: gbm-hr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gbm-hr-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minio_password};
      mc mb --ignore-existing local/hr-documents;
      mc mb --ignore-existing local/hr-resumes;
      mc mb --ignore-existing local/hr-training;
      mc mb --ignore-existing local/hr-rpa-receipts;
      exit 0;
      "
    networks:
      - gbm-hr-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: gbm-hr-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - gbm-hr-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: gbm-hr-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - gbm-hr-network

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: gbm-hr-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - gbm-hr-network

  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: gbm-hr-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    command: start-dev
    networks:
      - gbm-hr-network

  zeebe:
    image: camunda/zeebe:8.2
    container_name: gbm-hr-zeebe
    ports:
      - "26500:26500"
      - "9600:9600"
    environment:
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
    volumes:
      - zeebe_data:/usr/local/zeebe/data
    networks:
      - gbm-hr-network

  # ===== 应用服务 =====

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    container_name: gbm-hr-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-hr_admin}
      - DB_PASSWORD=${DB_PASSWORD:-hr_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minio_password}
      - KEYCLOAK_URL=http://keycloak:8080
      - ZEEBE_GATEWAY_ADDRESS=zeebe:26500
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app/app
      - ../database:/app/database
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - gbm-hr-network

  celery-worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile.worker
    container_name: gbm-hr-celery-worker
    depends_on:
      - backend
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ../app:/app/app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    networks:
      - gbm-hr-network

  celery-flower:
    build:
      context: ../
      dockerfile: docker/Dockerfile.worker
    container_name: gbm-hr-flower
    depends_on:
      - celery-worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5555:5555"
    command: celery -A app.celery_app flower --port=5555
    networks:
      - gbm-hr-network

  ocr-service:
    build:
      context: ../
      dockerfile: docker/Dockerfile.ocr
    container_name: gbm-hr-ocr
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "9001:9001"
    networks:
      - gbm-hr-network

  rpa-service:
    build:
      context: ../
      dockerfile: docker/Dockerfile.rpa
    container_name: gbm-hr-rpa
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "9002:9002"
    volumes:
      - rpa_screenshots:/app/screenshots
    networks:
      - gbm-hr-network

  face-service:
    build:
      context: ../
      dockerfile: docker/Dockerfile.face
    container_name: gbm-hr-face
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "9003:9003"
    networks:
      - gbm-hr-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: gbm-hr-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app/frontend
    networks:
      - gbm-hr-network

  nginx:
    image: nginx:alpine
    container_name: gbm-hr-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gbm-hr-network

  # ===== 监控服务 =====

  prometheus:
    image: prom/prometheus:latest
    container_name: gbm-hr-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - gbm-hr-network

  grafana:
    image: grafana/grafana:latest
    container_name: gbm-hr-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - gbm-hr-network

volumes:
  mysql_data:
  redis_data:
  minio_data:
  es_data:
  zeebe_data:
  rpa_screenshots:
  prometheus_data:
  grafana_data:

networks:
  gbm-hr-network:
    driver: bridge
