bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16
always-show-logo yes

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Security
requirepass changeme_redis_password

# Replication
replica-serve-stale-data yes
replica-read-only yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Lua scripting
lua-time-limit 5000

# Advanced
latency-tracking-threshold 100
notify-keyspace-events ""
