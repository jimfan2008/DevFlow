[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-ai-agent-hr"
version = "1.0.0"
description = "GBM AI Agent HR 智能人力管理系统 - AI Native HR Management Platform"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "python-multipart>=0.0.6",
    
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "pymysql>=1.1.0",
    "redis>=5.0.1",
    
    # AI / ML
    "openai>=1.6.0",
    "anthropic>=0.18.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.20",
    "sentence-transformers>=2.3.1",
    "faiss-cpu>=1.7.4",
    
    # OCR & Vision
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
    "opencv-python>=4.9.0",
    "face-api.py>=0.7.0",
    
    # RPA & Automation
    "playwright>=1.40.0",
    "selenium>=4.16.0",
    
    # Document Processing
    "python-docx>=0.8.11",
    "python-pptx>=0.6.23",
    "PyPDF2>=3.0.1",
    "pdfkit>=1.0.0",
    "weasyprint>=60.2",
    
    # Security
    "cryptography>=41.0.7",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    
    # Task Queue
    "celery>=5.3.6",
    "flower>=2.0.1",
    
    # Logging & Monitoring
    "structlog>=23.2.0",
    "sentry-sdk[fastapi]>=1.39.0",
    
    # Utilities
    "httpx>=0.26.0",
    "aiofiles>=23.2.1",
    "python-dateutil>=2.8.2",
    "arrow>=1.3.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    
    # Testing
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "responses>=0.24.1",
    
    # Internationalization
    "babel>=2.14.0",
    "pyicu>=2.12",
]

[project.optional-dependencies]
dev = [
    "black>=23.12.1",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.7",
    "safety>=2.3.5",
    "coverage>=7.4.0",
    "pytest-xdist>=3.5.0",
]
prod = [
    "gunicorn>=21.2.0",
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
gbm-hr = "src.core.cli:main"
gbm-hr-worker = "src.core.cli:worker"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "agent: marks tests as agent related",
    "security: marks tests as security related",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]
