name: Python Subservices CI

on:
  push:
    paths:
      - 'python-services/**'
  pull_request:
    paths:
      - 'python-services/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - rpa
          - ocr
          - face
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: python-services/${{ matrix.service }}
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: python-services/${{ matrix.service }}
        run: pytest

      - name: Security check
        working-directory: python-services/${{ matrix.service }}
        run: |
          pip install safety
          safety check
