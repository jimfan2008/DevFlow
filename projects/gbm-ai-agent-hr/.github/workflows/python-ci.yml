name: Python Sub-services CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'python/**'

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io

jobs:
  # --- Lint & Type Check ---
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ocr-service, face-service, rpa-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
      - name: Ruff Check
        run: ruff check python/${{ matrix.service }}/
      - name: Black Check
        run: black --check python/${{ matrix.service }}/

  # --- Unit Tests ---
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ocr-service, face-service, rpa-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Dependencies
        run: |
          cd python/${{ matrix.service }}
          pip install -e ".[dev]"
      - name: Run Tests
        run: |
          cd python/${{ matrix.service }}
          pytest tests/ -v --cov=src --cov-report=xml
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.service }}-coverage
          path: python/${{ matrix.service }}/coverage.xml

  # --- Security Scan ---
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ocr-service, face-service, rpa-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Dependencies
        run: |
          cd python/${{ matrix.service }}
          pip install bandit safety
      - name: Bandit Scan
        run: |
          cd python/${{ matrix.service }}
          bandit -r src/ -ll
      - name: Safety Check
        run: |
          cd python/${{ matrix.service }}
          safety check

  # --- Build Docker Images ---
  build:
    name: Build Python Sub-service Images
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ocr-service, face-service, rpa-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: python/${{ matrix.service }}
          file: python/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
