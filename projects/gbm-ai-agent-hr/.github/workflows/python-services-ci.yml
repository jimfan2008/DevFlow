name: Python Services CI

on:
  push:
    paths:
      - 'python-services/**'
    branches: [main, develop]
  pull_request:
    paths:
      - 'python-services/**'
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [rpa-service, ocr-service, face-service]
    name: Build & Test ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        working-directory: python-services/${{ matrix.service }}
        run: poetry install

      - name: Lint
        working-directory: python-services/${{ matrix.service }}
        run: poetry run ruff check .

      - name: Type Check
        working-directory: python-services/${{ matrix.service }}
        run: poetry run mypy .
        continue-on-error: true

      - name: Run Tests
        working-directory: python-services/${{ matrix.service }}
        run: poetry run pytest -v --cov=src
