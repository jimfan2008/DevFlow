name: Scheduled Checks

on:
  schedule:
    # Weekly dependency update check — every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
    # Daily security scan — every day at 04:00 UTC
    - cron: "0 4 * * *"

  workflow_dispatch:

jobs:
  dependency-update-check:
    name: Weekly Dependency Update Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && format('{0:d}', github.event.schedule) == 1 || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check for outdated packages
        run: |
          pip list --outdated --format=json > outdated-packages.json || true
          echo "Outdated packages:"
          cat outdated-packages.json

      - name: Upload outdated packages report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outdated-packages
          path: outdated-packages.json
          retention-days: 30

      - name: Report dependency status
        run: |
          OUTDATED_COUNT=$(cat outdated-packages.json | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Found $OUTDATED_COUNT outdated dependencies."
          if [ "$OUTDATED_COUNT" -gt 0 ]; then
            echo "::warning::There are $OUTDATED_COUNT outdated dependencies. Review outdated-packages.json."
          else
            echo "All dependencies are up to date."
          fi

  daily-security-scan:
    name: Daily Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && format('{0:d}', github.event.schedule) != 1 || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run bandit security scan
        run: |
          bandit -r src/ -ll -f json -o bandit-daily-report.json || true

      - name: Run safety vulnerability check
        run: |
          safety check -o json --output-file safety-daily-report.json || true

      - name: Upload security scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-security-reports
          path: |
            bandit-daily-report.json
            safety-daily-report.json
          retention-days: 30

      - name: Report security issues
        run: |
          echo "Daily security scan completed."
          if [ -f safety-daily-report.json ] && [ -s safety-daily-report.json ]; then
            echo "Safety report generated."
          fi
          if [ -f bandit-daily-report.json ] && [ -s bandit-daily-report.json ]; then
            echo "Bandit report generated."
          fi
