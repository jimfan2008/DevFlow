name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  # 代码检查
  code-check:
    name: Code Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle & SpotBugs
        run: |
          mvn checkstyle:check spotbugs:check -DskipTests

  # 单元测试
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: code-check
    strategy:
      matrix:
        service: [user-domain, recruit-domain, payroll-domain, auto-domain]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests with JaCoCo
        run: |
          mvn clean test -pl ${{ matrix.service }} -am
          mvn jacoco:report -pl ${{ matrix.service }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/site/jacoco/

  # 集成测试
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: unit-test
    strategy:
      matrix:
        service: [user-domain, recruit-domain, payroll-domain, auto-domain]
    defaults:
      run:
        working-directory: ./backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: |
          mvn verify -pl ${{ matrix.service }} -am \
            -Dspring.profiles.active=integration-test \
            -DDB_HOST=localhost \
            -DDB_PORT=3306 \
            -DDB_USERNAME=root \
            -DDB_PASSWORD=root \
            -DREDIS_HOST=localhost \
            -DREDIS_PORT=6379

  # 依赖漏洞扫描
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: code-check
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -o dw: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build domain service images
        run: |
          docker buildx build \
            -t gbm-hr/${{ matrix.service }}:${{ github.sha }} \
            -f Dockerfile.${{ matrix.service }} \
            --build-arg SERVICE=${{ matrix.service }} \
            --build-arg JAR_FILE=${{ matrix.service }}/target/${{ matrix.service }}-1.0.0-SNAPSHOT.jar \
            .

  # 构建 Python 子服务镜像
  build-python-services:
    name: Build Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [rpa-service, ocr-service, face-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: |
          docker buildx build \
            -t gbm-hr/${{ matrix.service }}:${{ github.sha }} \
            -f sub-services/${{ matrix.service }}/Dockerfile \
            sub-services/${{ matrix.service }}

  # 镜像安全扫描
  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    needs: [build-java-services, build-python-services]
    strategy:
      matrix:
        service: [user-domain, recruit-domain, payroll-domain, auto-domain, rpa-service, ocr-service, face-service]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gbm-hr/${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # 部署到开发环境
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - name: Deploy to dev environment
        run: |
          echo "Deploying to dev environment..."
          # docker-compose pull
          # docker-compose up -d --no-deps
          # ./scripts/smoke-test.sh

  # 部署到生产环境 (需手动审批)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Production deployment requires manual approval..."
          # 灰度发布流程
          # 1. 部署新版本到 1/3 实例
          # 2. 健康检查通过
          # 3. 观察 10 分钟
          # 4. 灰度通过 → 部署剩余 2/3 实例
