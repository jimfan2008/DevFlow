upstream user_domain {
    server user-domain:8081;
}
upstream recruit_domain {
    server recruit-domain:8082;
}
upstream payroll_domain {
    server payroll-domain:8083;
}
upstream auto_domain {
    server auto-domain:8084;
}
upstream rpa_service {
    server rpa-service:8090;
}
upstream ocr_service {
    server ocr-service:8091;
}
upstream face_service {
    server face-service:8092;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    # Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API Gateway routing
    location /api/user/ {
        proxy_pass http://user_domain/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /api/recruit/ {
        proxy_pass http://recruit_domain/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /api/payroll/ {
        proxy_pass http://payroll_domain/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /api/auto/ {
        proxy_pass http://auto_domain/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /api/rpa/ {
        proxy_pass http://rpa_service/;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    location /api/ocr/ {
        proxy_pass http://ocr_service/;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /api/face/ {
        proxy_pass http://face_service/;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://user_domain/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Monitoring
    location /actuator/prometheus {
        return 403;
    }
}
