apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gbm-ai-agent-hr
  namespace: gbm-hr
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hr.gbm.example.com
      secretName: gbm-hr-tls
  rules:
    - host: hr.gbm.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gbm-ai-agent-hr
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: gbm-ai-agent-hr
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: gbm-ai-agent-hr
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gbm-ai-agent-hr
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gbm-ai-agent-hr
                port:
                  number: 8000