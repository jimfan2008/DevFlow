version: '3.8'

# GBM AI Agent HR - 开发/生产环境 Docker Compose 配置
# 基于 SRS V15、后端 V35、数据库 V19 设计
# 启动命令: docker-compose up -d

services:
  # ============================================
  # 数据库层
  # ============================================

  # MySQL 8.x - 主数据库 (4 个独立 schema)
  mysql:
    image: mysql:8.0
    container_name: gbm-hr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-gbm_hr_db}
      MYSQL_USER: ${DB_USER:-hr_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hr_password}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=256M
      --slow-query-log=ON
      --slow-query-log-file=/var/log/mysql/slow-query.log
      --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Redis 7.x - 缓存、会话、Agent 锁
  redis:
    image: redis:7-alpine
    container_name: gbm-hr-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ============================================
  # 消息队列
  # ============================================

  # RabbitMQ - Agent 间消息队列
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: gbm-hr-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # Kafka - 事件总线 (Agent 结果回传)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: gbm-hr-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # Zookeeper - Kafka 依赖
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: gbm-hr-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - backend

  # ============================================
  # 对象存储
  # ============================================

  # MinIO - 对象存储
  minio:
    image: minio/minio:latest
    container_name: gbm-hr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
      - frontend

  # MinIO 初始化 - 创建 bucket
  minio-init:
    image: minio/mc:latest
    container_name: gbm-hr-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing myminio/hr-documents &&
      mc mb --ignore-existing myminio/hr-resumes &&
      mc mb --ignore-existing myminio/hr-videos &&
      mc mb --ignore-existing myminio/hr-receipts &&
      mc mb --ignore-existing myminio/hr-backups &&
      mc policy set download myminio/hr-documents &&
      exit 0
      "
    networks:
      - backend

  # ============================================
  # 搜索引擎
  # ============================================

  # Elasticsearch - 简历搜索与日志检索
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: gbm-hr-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - TZ=Asia/Shanghai
    ports:
      - "${ES_PORT:-9200}:9200"
      - "${ES_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # ============================================
  # 认证服务 (可选)
  # ============================================

  # Keycloak - 统一认证
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: gbm-hr-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/hr_user
      KC_DB_USERNAME: ${DB_USER:-hr_admin}
      KC_DB_PASSWORD: ${DB_PASSWORD:-hr_password}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    command: start-dev
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/realms/master || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend
      - frontend

  # ============================================
  # 应用服务
  # ============================================

  # 后端应用 - FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-hr-backend
    restart: unless-stopped
    environment:
      - APP_NAME=GBM AI Agent HR
      - APP_VERSION=1.0.0
      - DEBUG=${DEBUG:-true}
      - DATABASE_URL=mysql+pymysql://${DB_USER:-hr_admin}:${DB_PASSWORD:-hr_password}@mysql:***@mysql:3306/gbm_hr_db
      - DATABASE_ECHO=${DB_ECHO:-false}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=hr-documents
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=120
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dev-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-dev-key}
      - OCR_ENGINE=paddleocr
      - FACE_THRESHOLD=0.85
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=50
      - AUDIT_LOG_RETENTION_YEARS=10
      - TZ=Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend

  # Celery Worker - 异步任务处理
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-hr-celery-worker
    restart: unless-stopped
    environment:
      - APP_NAME=GBM AI Agent HR
      - DATABASE_URL=mysql+pymysql://${DB_USER:-hr_admin}:${DB_PASSWORD:-hr_password}@mysql:***@mysql:3306/gbm_hr_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=hr-documents
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dev-key}
      - OCR_ENGINE=paddleocr
      - UPLOAD_DIR=/app/uploads
      - TZ=Asia/Shanghai
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - backend
      - rabbitmq
      - redis
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --pool=solo
    networks:
      - backend

  # Celery Beat - 定时任务调度
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-hr-celery-beat
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      - TZ=Asia/Shanghai
    volumes:
      - ./app:/app/app
    depends_on:
      - celery-worker
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    networks:
      - backend

  # ============================================
  # Nginx 反向代理
  # ============================================

  # Nginx - 反向代理与静态文件服务
  nginx:
    image: nginx:latest
    container_name: gbm-hr-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - minio
    networks:
      - frontend
      - backend

  # ============================================
  # 监控服务
  # ============================================

  # Prometheus - 监控指标收集
  prometheus:
    image: prom/prometheus:latest
    container_name: gbm-hr-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.retention.time=15d
      --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring

  # Grafana - 监控仪表盘
  grafana:
    image: grafana/grafana:latest
    container_name: gbm-hr-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/dashboards:ro
      - ./monitoring/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  es_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
