version: '3.8'

# GBM AI Agent HR - Development & Production Environment
# Based on SRS V15, Backend V35, Database V19
# Start: docker-compose up -d

version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: gbm-hr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-gbm_hr_db}
      MYSQL_USER: ${DB_USER:-hr_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hr_password}
      TZ: Asia/Shanghai
    ports:
    - ${DB_PORT:-3306}:3306
    volumes:
    - mysql_data:/var/lib/mysql
    - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --max-connections=200 --innodb-buffer-pool-size=256M
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - backend
  redis:
    image: redis:7-alpine
    container_name: gbm-hr-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
    - ${REDIS_PORT:-6379}:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD:-redis_password}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - backend
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: gbm-hr-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
    - ${RABBITMQ_PORT:-5672}:5672
    - ${RABBITMQ_MGMT_PORT:-15672}:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - check_running
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
    - backend
  minio:
    image: minio/minio:latest
    container_name: gbm-hr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
    - ${MINIO_PORT:-9000}:9000
    - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - backend
    - frontend
  minio-init:
    image: minio/mc:latest
    container_name: gbm-hr-minio-init
    depends_on:
    - minio
    entrypoint: /bin/sh -c "mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}
      && mc mb --ignore-existing myminio/hr-documents && mc mb --ignore-existing myminio/hr-resumes && mc mb --ignore-existing
      myminio/hr-videos && mc mb --ignore-existing myminio/hr-receipts && mc mb --ignore-existing myminio/hr-backups && exit
      0"
    networks:
    - backend
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: gbm-hr-elasticsearch
    restart: unless-stopped
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms256m -Xmx256m
    - TZ=Asia/Shanghai
    ports:
    - ${ES_PORT:-9200}:9200
    - ${ES_TRANSPORT_PORT:-9300}:9300
    volumes:
    - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:9200/_cluster/health
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
    - backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-hr-backend
    restart: unless-stopped
    environment:
      APP_NAME: GBM AI Agent HR
      APP_VERSION: 1.0.0
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: mysql+pymysql://${DB_USER:-hr_admin}:${DB_PASSWORD:-hr_password}@mysql:3306/hr_user
      DATABASE_ECHO: ${DB_ECHO:-false}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: hr-documents
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: '120'
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: '7'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dev-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-dev-key}
      OCR_ENGINE: paddleocr
      FACE_THRESHOLD: '0.85'
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: '50'
      AUDIT_LOG_RETENTION_YEARS: '10'
      TZ: Asia/Shanghai
    ports:
    - ${BACKEND_PORT:-8000}:8000
    volumes:
    - ./app:/app/app
    - ./uploads:/app/uploads
    - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - backend
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-hr-celery-worker
    restart: unless-stopped
    environment:
      APP_NAME: GBM AI Agent HR
      DATABASE_URL: mysql+pymysql://${DB_USER:-hr_admin}:${DB_PASSWORD:-hr_password}@mysql:3306/hr_user
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: hr-documents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dev-key}
      OCR_ENGINE: paddleocr
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    volumes:
    - ./app:/app/app
    - ./uploads:/app/uploads
    - ./logs:/app/logs
    depends_on:
    - backend
    - rabbitmq
    - redis
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    networks:
    - backend
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-hr-celery-beat
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      TZ: Asia/Shanghai
    volumes:
    - ./app:/app/app
    depends_on:
    - celery-worker
    command: celery -A app.core.celery_app beat --loglevel=info
    networks:
    - backend
  nginx:
    image: nginx:latest
    container_name: gbm-hr-nginx
    restart: unless-stopped
    ports:
    - ${NGINX_HTTP_PORT:-80}:80
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - backend
    - minio
    networks:
    - frontend
    - backend
  prometheus:
    image: prom/prometheus:latest
    container_name: gbm-hr-prometheus
    restart: unless-stopped
    ports:
    - ${PROMETHEUS_PORT:-9090}:9090
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=15d
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9090/-/healthy || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: gbm-hr-grafana
    restart: unless-stopped
    ports:
    - ${GRAFANA_PORT:-3000}:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/dashboards:ro
    - ./monitoring/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    depends_on:
    - prometheus
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - monitoring
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  es_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
