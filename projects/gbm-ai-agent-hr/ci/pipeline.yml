# GBM AI Agent HR - CI/CD Pipeline Configuration
# 基于 DevFlow 16 步开发流程

name: GBM HR CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ==================== 代码质量检查 ====================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black 代码格式化检查
        run: black --check --diff app/

      - name: isort 导入排序检查
        run: isort --check-only --diff app/

      - name: flake8 代码风格检查
        run: flake8 app/ --max-line-length=120 --ignore=E203,W503

      - name: mypy 类型检查
        run: mypy app/ --ignore-missing-imports

      - name: bandit 安全扫描
        run: bandit -r app/ -ll -qq

      - name: safety 依赖安全扫描
        run: safety check --full-report

  # ==================== 单元测试 ====================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: gbm_hr_test
          MYSQL_USER: hr_admin
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行单元测试
        env:
          DATABASE_URL: mysql+pymysql://hr_admin:test_password@localhost:3306/gbm_hr_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key
        run: |
          pytest app/tests/ \
            -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            -m "not slow and not integration"

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ==================== 集成测试 ====================
  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 启动基础设施服务
        run: |
          docker-compose -f docker-compose.yml up -d mysql redis rabbitmq minio elasticsearch
          sleep 30

      - name: 初始化数据库
        run: |
          docker-compose exec -T mysql mysql -u root -ptest_root -e "CREATE DATABASE IF NOT EXISTS gbm_hr_test; GRANT ALL ON gbm_hr_test.* TO 'hr_admin'@'%';"

      - name: 运行集成测试
        env:
          DATABASE_URL: mysql+pymysql://hr_admin:test_password@mysql:3306/gbm_hr_test
          REDIS_URL: redis://test_redis_password@redis:6379/0
          RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
          MINIO_ENDPOINT: minio:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          ELASTICSEARCH_URL: http://elasticsearch:9200
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key
        run: |
          pytest app/tests/ \
            -v \
            -m integration \
            --tb=short

      - name: 停止服务
        if: always()
        run: docker-compose down

  # ==================== 构建 Docker 镜像 ====================
  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/gbm-hr-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到测试环境 ====================
  deploy-staging:
    name: 部署到测试环境
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Staging
        run: |
          echo "部署到测试环境..."
          # 实际部署命令根据环境配置

  # ==================== 部署到生产环境 ====================
  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: 部署到生产环境
        run: |
          echo "部署到生产环境..."
          # 实际部署命令根据环境配置
