version: '3.8'

# GBM AI Agent HR - Development Environment
# 启动命令: docker-compose -f docker-compose.dev.yml up -d

services:
  # MySQL 8.x - 主数据库
  mysql:
    image: mysql:8.0
    container_name: gbm-hr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev_root_password}
      MYSQL_DATABASE: ${DB_NAME:-gbm_hr_db}
      MYSQL_USER: ${DB_USER:-hr_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev_hr_password}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7.x - 缓存 & 会话
  redis:
    image: redis:7-alpine
    container_name: gbm-hr-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dev_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ - Agent间消息队列
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: gbm-hr-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO - 对象存储
  minio:
    image: minio/minio:latest
    container_name: gbm-hr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dev_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 客户端 - 创建初始bucket
  minio-init:
    image: minio/mc:latest
    container_name: gbm-hr-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-dev_minio_password} &&
      mc mb --ignore-existing myminio/hr-documents &&
      mc mb --ignore-existing myminio/hr-resumes &&
      mc mb --ignore-existing myminio/hr-videos &&
      mc mb --ignore-existing myminio/hr-receipts &&
      mc mb --ignore-existing myminio/hr-backups &&
      exit 0
      "

  # Elasticsearch - 简历搜索 & 日志检索
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: gbm-hr-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 后端应用 (开发模式)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-hr-backend
    restart: unless-stopped
    environment:
      - APP_NAME=GBM AI Agent HR
      - DEBUG=true
      - DATABASE_URL=mysql+pymysql://${DB_USER:-hr_admin}:${DB_PASSWORD:-dev_hr_password}@mysql:3306/${DB_NAME:-gbm_hr_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-dev_minio_password}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Celery Worker - 异步任务
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-hr-celery-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER:-hr_admin}:${DB_PASSWORD:-dev_hr_password}@mysql:3306/${DB_NAME:-gbm_hr_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-dev_minio_password}
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    depends_on:
      - backend
      - rabbitmq
      - redis
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  # Celery Beat - 定时任务
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-hr-celery-beat
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/1
    volumes:
      - ./app:/app/app
    depends_on:
      - celery-worker
    command: celery -A app.core.celery_app beat --loglevel=info

  # Nginx - 反向代理
  nginx:
    image: nginx:alpine
    container_name: gbm-hr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend

  # Prometheus - 监控指标收集
  prometheus:
    image: prom/prometheus:latest
    container_name: gbm-hr-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.retention.time=15d

  # Grafana - 监控仪表盘
  grafana:
    image: grafana/grafana:latest
    container_name: gbm-hr-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  es_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
