server:
  port: 8084
  servlet:
    context-path: /

spring:
  application:
    name: auto-domain
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/hr_auto?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: auto-domain-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.gbm.hr.auto.model
  configuration:
    map-underscore-to-camel-case: true

# Python 子服务地址
sub-services:
  rpa:
    url: http://${RPA_SERVICE_HOST:localhost}:8090
    timeout: 300000
  ocr:
    url: http://${OCR_SERVICE_HOST:localhost}:8091
    timeout: 10000
  face:
    url: http://${FACE_SERVICE_HOST:localhost}:8092
    timeout: 10000

logging:
  level:
    com.gbm.hr: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
