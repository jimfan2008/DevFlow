# Redis Production Configuration
# =============================================================================
# Optimized for production workloads with persistence and memory management
# =============================================================================

# Network settings
bind 127.0.0.1 ::1
port 6379
protected-mode yes

# Network settings for Docker
# Uncomment to allow external connections in Docker
# bind 0.0.0.0

# Basic settings
daemonize no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis.log
databases 16

# Persistence - Enable RDB and AOF
save 900 1
save 300 10
save 60 10000

# RDB configuration
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

# AOF configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# Memory management
maxmemory ${REDIS_MAXMEMORY:-512mb}
maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}

# Eviction settings
maxmemory-samples 10

# Performance optimizations
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
activerehashing yes
min-reconnect-buffer-size 512

# Client settings
maxclients 10000
tcp-keepalive 300

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Enable Lua debugging (disable in production)
# lua-debug true

# Cluster settings (if using Redis Cluster)
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000

# Security - Enable if needed
# requirepass ${REDIS_PASSWORD}
