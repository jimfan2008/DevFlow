# Redis Development Configuration
# =============================================================================
# Optimized for development with minimal settings and easy debugging
# =============================================================================

# Network settings
bind 127.0.0.1 ::1
port 6379
protected-mode no

# Basic settings
daemonize no
pidfile /var/run/redis/redis-server.pid
loglevel debug
logfile /var/log/redis/redis.log
databases 16

# Minimal persistence for development
save ""

# RDB configuration
rdbcompression no
rdbchecksum no
dbfilename dump.rdb
dir ./

# AOF configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync always
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# Memory management - generous for development
maxmemory ${REDIS_MAXMEMORY:-256mb}
maxmemory-policy noeviction

# Eviction settings
maxmemory-samples 5

# Performance settings
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no
activerehashing yes
min-reconnect-buffer-size 512

# Client settings
maxclients 1000
tcp-keepalive 60

# Slow log (more verbose for debugging)
slowlog-log-slower-than 1000
slowlog-max-len 256

# Client output buffer limits
client-output-buffer-limit normal 64mb 16mb 60
client-output-buffer-limit replica 32mb 8mb 60
client-output-buffer-limit pubsub 8mb 4mb 60

# Lua debugging enabled
lua-debug true

# Security - disabled for development
# requirepass redis-dev-password
