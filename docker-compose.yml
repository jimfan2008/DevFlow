# =============================================================================
# DevFlow Docker Compose - Staging / Integration Environment
# =============================================================================
# Purpose: Full-stack deployment for staging/integration testing
# Usage: docker-compose up -d
# ===========================================================================
version: "3.8"

services:
  # --------------------------------------------------------------
  # FastAPI Backend Service
  # ================================================================
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: devflow-fastapi
    ports:
      - "8000:8000"
    environment:
      # --- Core App ------------------------------------------------
      - APP_NAME=DevFlow
      - APP_DEBUG=false
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      # --- JWT Auth --------------------------------------------------
      - JWT_SECRET=staging-jwt-secret-change-in-prod
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=30
      - SECRET_KEY=staging-secret-key-change-in-prod
      # --- Database (PostgreSQL) -------------------------------------
      - DATABASE_URL=postgresql+asyncpg://devflow_user:devflow_password@postgres:5432/devflow_db
      # --- Redis (caching & rate-limiting) ---------------------------
      - REDIS_URL=redis://redis:6379/0
      # --- Celery (queue processing) ---------------------------------
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # --- Frontend CORS                                             ---
      - FRONTEND_URL=http://localhost:3000
      # --- Hermes Integration                                          ---
      - HERMES_API_BASE=${HERMES_API_BASE:-http://localhost:8642/v1}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-hermes-agent}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devflow-network

  # --------------------------------------------------------------
  # PostgreSQL Database
  # ======================================================================
  postgres:
    image: postgres:16-alpine
    container_name: devflow-postgres
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_USER=devflow_user
      - POSTGRES_PASSWORD=devflow_password
      - POSTGRES_DB=devflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U devflow_user -d devflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - devflow-network

  # --------------------------------------------------------------
  # Redis Cache
  # ======================================================================
  redis:
    image: redis:7-alpine
    container_name: devflow-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - devflow-network

  # --------------------------------------------------------------
  # Nginx (Frontend SPA + Reverse Proxy)
  # ======================================================================
  nginx:
    image: nginx:alpine
    container_name: devflow-nginx
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - nginx_static:/usr/share/nginx/html
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devflow-network

  # --------------------------------------------------------------
  # Frontend Builder (one-shot: builds Vue app -> volume)
  # ======================================================================
  frontend-builder:
    image: node:20-alpine
    container_name: devflow-frontend-builder
    working_dir: /app
    command: >
      sh -c "npm ci && npm run build"
    volumes:
      - ./frontend:/app
      - nginx_static:/app/dist
    restart: "no"

  # --------------------------------------------------------------
  # Wait-for-dependency bootstrap (runs once to build + serve frontend)
  # ======================================================================
  #  This wrapper starts frontend-builder, waits for dist output,
  #  then exits — nginx picks up the volume automatically.
  # -----------------------------------------------------------------
  wait-build:
    image: alpine:3.18
    container_name: devflow-wait-build
    command: >
      sh -c "apk add --no-cache curl &&
             dockerize -wait http://nginx:80/nginx-health -timeout 120s || true &&
             # Just spin: nginx pulls static files from shared volume"
    depends_on:
      - nginx
      - frontend-builder
    restart: "no"

volumes:
  postgres_data:
    name: devflow_postgres_data
  redis_data:
    name: devflow_redis_data
  nginx_static:
    name: devflow_nginx_static

networks:
  devflow-network:
    name: devflow-network
    driver: bridge
